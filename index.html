.wrap{width:100%;max-width:640px;margin-left:auto;margin-right:auto;padding-left:18px;padding-right:18px}

/* Merkene fra boka: rød prikk = viktig kode, gul overstreking = valgt/riktig, rød strek = feil */
.dot{display:inline-block;flex:none;width:13px;height:13px;background:var(--red);border-radius:52% 46% 55% 45%/47% 55% 45% 53%;transform:rotate(-8deg)}
.dot.sm{width:9px;height:9px}
.dot.big{width:18px;height:18px}
.tab.on .lbl,.toggle button.on .lbl,.opt.is-right .txt{
  background-image:linear-gradient(102deg,transparent .18em,var(--hl) .3em,var(--hl) calc(100% - .3em),transparent calc(100% - .18em));
  background-repeat:no-repeat;background-size:100% 78%;background-position:0 60%;
  -webkit-box-decoration-break:clone;box-decoration-break:clone;
  padding:0 .3em;margin:0 -.3em;color:var(--hl-ink);
}

/* Topp */
.top{border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:center;gap:12px;padding-top:18px}
.brand h1{margin:0;font-size:27px;line-height:1.1;letter-spacing:-.005em}
.sub{margin:2px 0 0;font-size:15px;color:var(--ink-2)}
.tabs{display:flex;gap:4px;margin:10px 0 0 -10px}
.tab{appearance:none;background:none;border:0;padding:10px 10px 12px;font-size:17px;font-weight:700;color:var(--ink-2);cursor:pointer}

/* Valg */
.controls{display:grid;gap:10px;margin-top:18px}
.toggle{display:flex;border:1px solid var(--rule-strong);border-radius:3px}
.toggle button{flex:1 1 0;min-width:0;appearance:none;background:none;border:0;border-left:1px solid var(--rule-strong);padding:9px 8px;min-height:48px;font-size:15px;font-weight:700;line-height:1.3;color:var(--ink-2);cursor:pointer;text-wrap:balance}
.toggle button:first-child{border-left:0}
.toggle button:not(.on):hover{background:var(--hover)}
.toggle .n{font-weight:400}
.toggle .dot{margin-right:6px;vertical-align:1px}

/* Fremgang */
.meter-wrap{margin:18px 0 22px}
.meter{display:grid;grid-template-columns:repeat(var(--n,17),minmax(0,1fr));gap:3px}
.meter.dense{gap:2px}
.meter i{display:block;height:10px;background:var(--rule)}
.meter i[data-b="1"]{background:var(--lvl1)}
.meter i[data-b="2"]{background:var(--lvl2)}
.meter i[data-b="3"]{background:var(--lvl3)}
.stats{margin:9px 0 0;display:flex;flex-wrap:wrap;gap:2px 18px;font-size:14px;color:var(--ink-2)}
.stats b{color:var(--ink)}

/* Quiz */
.ask{margin:0;font-size:17px;color:var(--ink-2)}
.code{font-weight:700;letter-spacing:.045em;line-height:1.05}
.code-xl{display:flex;align-items:center;gap:14px;font-size:clamp(52px,16vw,72px);margin:2px 0 20px}
.prompt{margin:4px 0 20px;font-size:23px;font-weight:700;line-height:1.3;text-wrap:pretty}
.tbl{border:1px solid var(--rule-strong)}
.bar{display:flex;gap:24px;background:var(--bar);color:var(--bar-ink);font-size:15px;font-weight:700;padding:5px 12px;margin:-1px -1px 0}
.opt{appearance:none;display:grid;grid-template-columns:22px 1fr 20px;gap:10px;align-items:start;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule-strong);padding:13px 12px;font-size:17px;line-height:1.4;color:var(--ink);cursor:pointer}
.rows .opt:first-child{border-top:0}
.opt:not([aria-disabled]):hover{background:var(--hover)}
.opt[aria-disabled]{cursor:default}
.letter{font-weight:700;color:var(--ink-3)}
.mark{font-weight:700;text-align:right}
.opt.is-wrong .txt{color:var(--ink-2);text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:.12em}
.opt.is-wrong .mark{color:var(--red)}
.opt.is-dim{color:var(--ink-3)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.grid .opt{grid-template-columns:18px minmax(0,1fr) 14px;gap:8px;align-items:center;padding:14px 10px 14px 12px}
.grid .opt:nth-child(-n+2){border-top:0}
.grid .opt:nth-child(even){border-left:1px solid var(--rule-strong)}
.grid .txt{font-size:clamp(20px,6.5vw,24px);font-weight:700;letter-spacing:.045em;white-space:nowrap}
.grid .txt.long{font-size:clamp(16px,5vw,20px);letter-spacing:.02em}

/* Fasit */
.reveal{margin-top:22px}
.verdict{margin:0 0 12px;font-size:19px;font-weight:700}
.verdict.bad{color:var(--red)}
.detail{border-top:2px solid var(--ink);padding-top:10px}
.detail-h{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.code-m{font-size:30px}
.pair{display:grid;grid-template-columns:4.4em 1fr;gap:12px;padding:9px 0;border-top:1px solid var(--rule)}
.detail-h + .pair{border-top:0}
.pair-k{font-weight:700;color:var(--ink-2);letter-spacing:.03em}
.scale{display:block;margin-top:3px;font-size:15px;color:var(--ink-2)}
.mn{margin:10px 0 0;font-size:16px}
.mn b,.note b{margin-right:.3em}
.note{margin:8px 0 0;font-size:15px;color:var(--ink-2)}
.note b{color:var(--ink)}
.also{margin:14px 0 0;padding:2px 0 2px 12px;border-left:3px solid var(--red);font-size:15px;color:var(--ink-2)}
.also b{color:var(--ink)}

/* Kort */
.flip{display:block;perspective:1400px;cursor:pointer;outline:none;border-radius:6px}
.flip:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.flip-in{display:grid;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.75,.25,1)}
.flip.is-flipped .flip-in{transform:rotateY(180deg)}
.face{grid-area:1/1;position:relative;-webkit-backface-visibility:hidden;backface-visibility:hidden;display:flex;flex-direction:column;min-height:340px;padding:22px 20px 18px;background:var(--card);border:1px solid var(--rule-strong);border-radius:6px;box-shadow:var(--lift)}
.face.back{transform:rotateY(180deg)}
.face-mid{margin:auto 0;padding:12px 0;text-align:center}
.code-xxl{display:block;font-size:clamp(64px,22vw,104px);margin-top:6px}
.code-xxl.long{font-size:clamp(40px,13vw,64px)}
.face .prompt{margin:10px 0 0}
.hint{margin:14px 0 0;text-align:center;font-size:14px;color:var(--ink-3)}
.corner{position:absolute;top:16px;left:16px}
@media (prefers-reduced-motion:reduce){.flip-in{transition:none}}

/* Oversikt */
.intro{margin:0 0 18px;font-size:16px;color:var(--ink-2)}
.intro p{margin:0 0 8px}
.intro b{color:var(--ink)}
.book{border:1px solid var(--rule-strong)}
.book .bar{padding-left:30px}
.rowlist{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:26px 1fr;gap:0 4px;padding:12px 12px 13px 0;border-top:1px solid var(--rule-strong)}
.row:first-child{border-top:0}
.dcol{display:flex;justify-content:center;padding-top:9px}
.row-h{display:flex;align-items:center;gap:10px}
.code-l{font-size:23px}
.pips{margin-left:auto;display:inline-flex;gap:3px}
.pips i{display:block;width:12px;height:6px;background:var(--rule)}
.pips i.on{background:var(--lvl2)}
.pips.m i{background:var(--lvl3)}
.line{display:grid;grid-template-columns:4.4em 1fr;gap:10px;margin:5px 0 0;font-size:16px}
.line-k{font-weight:700;color:var(--ink-2);letter-spacing:.03em}
.row .mn{font-size:15px;margin-top:8px}
.sec{margin:28px 0 10px;font-size:18px}
.foot{margin:26px 0 0}
.ghost{appearance:none;background:none;border:1px solid var(--rule-strong);border-radius:3px;padding:11px 14px;font-size:15px;font-weight:700;color:var(--ink-2);cursor:pointer}
.ghost.armed{border-color:var(--red);color:var(--red)}
.src{margin:12px 0 0;font-size:14px;color:var(--ink-3)}

/* Knapperad nederst */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:var(--page);background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--rule)}
.dock-in{max-width:604px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1 1 0;appearance:none;min-height:52px;padding:12px 14px;border-radius:3px;border:1.5px solid var(--ink);background:none;color:var(--ink);font-size:17px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--bar);border-color:var(--bar);color:var(--bar-ink)}
.btn:active{transform:translateY(1px)}
main{padding-bottom:40px}
body.has-dock main{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}

/* ---- Tillegg for lisensquizen ---- */
.chap-bar{display:flex;justify-content:space-between;gap:12px}
.chap-bar .k{font-weight:400;opacity:.8;white-space:nowrap}
.opt .txt{display:inline}
.rows .opt{grid-template-columns:22px 1fr 20px}
.calc{display:inline-block;margin-left:8px;padding:1px 7px;border:1px solid var(--rule-strong);border-radius:3px;font-size:13px;font-weight:700;color:var(--ink-2);vertical-align:2px;letter-spacing:.02em}
.explain{margin:0;padding:10px 0 0;border-top:2px solid var(--ink);font-size:16px}
.explain b{margin-right:.3em}
.src-line{margin:10px 0 0;font-size:14px;color:var(--ink-3)}

/* Fremdriftsstolpe – én stripe, delt etter nivå */
.prog{display:flex;height:10px;background:var(--rule);overflow:hidden}
.prog i{display:block;height:100%}
.prog .l1{background:var(--lvl1)}
.prog .l2{background:var(--lvl2)}
.prog .l3{background:var(--lvl3)}
.prog.sm{height:6px;margin-top:8px}

/* Kapittelliste */
.chap{display:grid;grid-template-columns:30px 1fr;gap:0 6px;padding:13px 12px 14px 8px;border-top:1px solid var(--rule-strong);cursor:pointer;-webkit-tap-highlight-color:transparent}
.chap:first-child{border-top:0}
.chap:hover{background:var(--hover)}
.box{width:20px;height:20px;margin-top:2px;border:1.5px solid var(--ink);border-radius:3px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;line-height:1}
.chap.on .box{background:var(--hl);border-color:var(--hl-ink);color:var(--hl-ink)}
.chap-h{display:flex;align-items:baseline;gap:10px}
.chap-n{font-weight:700;font-size:17px}
.chap-c{margin-left:auto;font-size:14px;color:var(--ink-2);white-space:nowrap}
.chap-s{margin:3px 0 0;font-size:14px;color:var(--ink-2)}
.chap-tools{display:flex;gap:8px;margin:0 0 12px}

/* Prøvetest */
.exam-intro{margin:0 0 16px;font-size:16px;color:var(--ink-2)}
.exam-intro p{margin:0 0 8px}
.count{margin:0 0 6px;font-size:15px;font-weight:700;color:var(--ink-2)}
.score{display:flex;align-items:baseline;gap:14px;margin:4px 0 6px}
.score .big{font-size:clamp(52px,16vw,72px);font-weight:700;line-height:1}
.score .of{font-size:19px;color:var(--ink-2)}
.breakdown{margin:16px 0 0}
.bd-row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:8px 0;border-top:1px solid var(--rule);font-size:15px}
.bd-row b{font-weight:700}
.miss{margin:0;padding:14px 0;border-top:1px solid var(--rule-strong)}
.miss:first-of-type{border-top:0}
.miss-q{margin:0 0 6px;font-weight:700}
.miss-a{margin:2px 0 0;font-size:15px}
.miss-a.bad{color:var(--ink-2);text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:.12em}
.miss .explain{border-top:0;padding-top:6px;font-size:15px;color:var(--ink-2)}
.empty{padding:22px 0;color:var(--ink-2)}
.opt.is-picked{background:var(--hover)}
.opt.is-picked .letter{color:var(--ink)}
.opt.is-picked .txt{background-image:linear-gradient(102deg,transparent .18em,var(--lvl1) .3em,var(--lvl1) calc(100% - .3em),transparent calc(100% - .18em));background-repeat:no-repeat;background-size:100% 78%;background-position:0 60%;-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 .3em;margin:0 -.3em}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <span class="dot big" aria-hidden="true"></span>
      <div>
        <h1>Lisensquiz</h1>
        <p class="sub">Hele lisenskurset – øving til amatørradioprøven</p>
      </div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Del av appen">
      <button type="button" class="tab" role="tab" data-tab="quiz"><span class="lbl">Øv</span></button>
      <button type="button" class="tab" role="tab" data-tab="exam"><span class="lbl">Prøvetest</span></button>
      <button type="button" class="tab" role="tab" data-tab="chapters"><span class="lbl">Kapitler</span></button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="controls" id="controls"></div>
  <div class="meter-wrap" id="meterWrap">
    <div class="prog" id="prog" aria-hidden="true"></div>
    <p class="stats" id="stats"></p>
  </div>
  <div id="view"></div>
</main>

<div class="dock" id="dock" hidden><div class="dock-in" id="dockIn"></div></div>

<script>
(() => {
"use strict";

const CHAPTERS = [
  {k:"el",   n:"2",  t:"Grunnleggende elektronikk"},
  {k:"hl",   n:"3",  t:"Halvledere og rør"},
  {k:"tx",   n:"4",  t:"Senderen"},
  {k:"txf",  n:"5",  t:"Senderforstyrrelser"},
  {k:"rx",   n:"6",  t:"Mottakeren"},
  {k:"dsp",  n:"7",  t:"Digital signalbehandling"},
  {k:"ant",  n:"8",  t:"Fødekabler og antenner"},
  {k:"prop", n:"9",  t:"Bølgeutbredelse"},
  {k:"emc",  n:"10", t:"EMC"},
  {k:"mal",  n:"11", t:"Måleteknikk"},
  {k:"reg",  n:"12", t:"Operasjon, prosedyrer og regler"},
  {k:"sik",  n:"13", t:"Sikkerhet"},
  {k:"kod",  n:"16", t:"Q-koder, fonetikk og forkortelser"}
];
const CH = Object.fromEntries(CHAPTERS.map((c) => [c.k, c]));

// Spørsmålene. Første svaralternativ er alltid riktig – appen stokker dem.
const QS = [];
function hash(s){ let h = 5381; for(let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
function Q(k, q, o, f, r){ QS.push({id: k + "-" + hash(q), k, q, o, f, r: !!r}); }
// Første svaralternativ er alltid riktig – appen stokker rekkefølgen.
// r:1 = regneoppgave
Q("el","Hva er effekten når en pære på 12 V trekker 2 A?",["24 W","6 W","14 W","0,17 W"],"Effektloven: P = U × I = 12 V × 2 A = 24 W.",1);
Q("el","En motstand på 470 Ω har 9,4 V over seg. Hvor stor strøm går gjennom den?",["20 mA","2 mA","50 mA","4,4 A"],"Ohms lov: I = U / R = 9,4 / 470 = 0,02 A = 20 mA.",1);
Q("el","Hva er motstanden i en billyspære på 60 W og 12 V?",["2,4 Ω","5 Ω","720 Ω","0,2 Ω"],"R = U² / P = 144 / 60 = 2,4 Ω.",1);
Q("el","To motstander på 100 Ω og 220 Ω kobles i serie. Hva blir total motstand?",["320 Ω","69 Ω","120 Ω","22 kΩ"],"I serie legges motstandene sammen: 100 + 220 = 320 Ω.",1);
Q("el","To like motstander på 1 kΩ kobles i parallell. Hva blir total motstand?",["500 Ω","2 kΩ","1 kΩ","250 Ω"],"n like motstander i parallell: R/n = 1000/2 = 500 Ω.",1);
Q("el","Hva er total motstand av 20 kΩ, 10 kΩ og 5 kΩ i parallell?",["Ca. 2,9 kΩ","35 kΩ","Ca. 11,7 kΩ","5 kΩ"],"1/R = 1/20 + 1/10 + 1/5 = 7/20, så R = 20/7 ≈ 2,9 kΩ. Totalen er alltid mindre enn den minste motstanden.",1);
Q("el","En spenningsdeler har R1 = 3 kΩ og R2 = 1 kΩ og får 12 V inn. Hva er spenningen over R2?",["3 V","4 V","9 V","12 V"],"Uut = Uinn × R2 / (R1 + R2) = 12 × 1/4 = 3 V.",1);
Q("el","Hva er enheten for elektrisk ladning?",["Coulomb (C)","Joule (J)","Farad (F)","Henry (H)"],"Én coulomb er ladningen som tilsvarer 1 ampere i 1 sekund.");
Q("el","Hva er 1 joule?",["Ett wattsekund","Én ampere i ett sekund","Én volt per ampere","Én watt per time"],"Energi = effekt × tid. 1 J = 1 Ws.");
Q("el","Når overføres maksimal effekt fra en kilde til en last?",["Når lastmotstanden er lik kildens indre motstand","Når lastmotstanden er null","Når lastmotstanden er uendelig stor","Når lastmotstanden er halvparten av indre motstand"],"Maksimal effektoverføring skjer når kildemotstand og lastmotstand er like store.");
Q("el","Et batteri har EMK 12 V og indre motstand 0,5 Ω. Hva blir polspenningen når det trekkes 4 A?",["10 V","12 V","2 V","14 V"],"Upol = EMK − I × r = 12 − 4 × 0,5 = 10 V.",1);
Q("el","Hva skjer med kapasitansen hvis avstanden mellom kondensatorplatene dobles?",["Den halveres","Den dobles","Den firedobles","Den er uendret"],"C = K × A / d. Kapasitansen er omvendt proporsjonal med avstanden d.");
Q("el","Hva er total kapasitans av 100 pF og 220 pF i parallell?",["320 pF","69 pF","120 pF","22 nF"],"Kondensatorer i parallell legges sammen (som om plateflaten økes).",1);
Q("el","To kondensatorer på 10 nF kobles i serie. Hva blir total kapasitans?",["5 nF","20 nF","10 nF","100 nF"],"I serie: C1×C2/(C1+C2) = 100/20 = 5 nF. Formelen er som for motstander i parallell.",1);
Q("el","Hva kjennetegner en elektrolyttkondensator?",["Den er polarisert og tåler ikke feil polaritet","Den har luft som dielektrikum","Den egner seg best på høye radiofrekvenser","Den har svært liten kapasitans"],"Elektrolyttkondensatorer har stor kapasitans, men må kobles riktig vei og ikke utsettes for overspenning.");
Q("el","Hvilken kondensatortype egner seg godt i avstemte kretser på radiofrekvenser?",["Keramisk med lav dielektrisk konstant eller glimmer","Elektrolytt","Høy-k keramisk","Papirkondensator"],"Keramiske kondensatorer med lav k og glimmerkondensatorer har lave tap og er stabile på RF.");
Q("el","Hva er tidskonstanten for en RC-krets med 100 kΩ og 10 µF?",["1 sekund","0,1 sekund","10 sekunder","1 millisekund"],"t = R × C = 100 000 × 0,000 01 = 1 s. Etter ca. 5t er kondensatoren nesten fulladet.",1);
Q("el","Hvorfor bør det sitte en motstand fast over glattekondensatoren i en høyspent strømforsyning?",["For å lade ut kondensatoren når forsyningen slås av","For å øke utgangsspenningen","For å fjerne brum","For å begrense startstrømmen"],"En slik «bleeder»-motstand tømmer kondensatoren slik at du ikke får støt når apparatet åpnes.");
Q("el","Hva er enheten for induktans?",["Henry (H)","Farad (F)","Ohm (Ω)","Tesla (T)"],"En spole har 1 H når 1 A/s endring i strømmen induserer 1 V.");
Q("el","Hvordan øker du induktansen til en spole?",["Flere viklinger eller en ferrittkjerne","Færre viklinger","Strekke viklingene fra hverandre","Bruke tykkere tråd"],"Induktansen øker med antall viklinger, større diameter og kjerne med høy permeabilitet. Den minker når viklingene trekkes fra hverandre.");
Q("el","To spoler på 10 µH og 15 µH kobles i serie (uten kobling mellom dem). Hva blir total induktans?",["25 µH","6 µH","150 µH","5 µH"],"Spoler i serie legges sammen, akkurat som motstander.",1);
Q("el","Hva er tidskonstanten i en LR-krets?",["t = L / R","t = L × R","t = R / L","t = 1/(2πLR)"],"Tidskonstanten for spole og motstand er L/R. Etter ca. 5t har strømmen nådd sluttverdien.");
Q("el","En sinusspenning har perioden T = 1 ms. Hva er frekvensen?",["1 kHz","1 Hz","100 Hz","1 MHz"],"f = 1/T = 1/0,001 s = 1000 Hz.",1);
Q("el","En sinusspenning har spissverdi 14,1 V. Hva er effektivverdien (RMS)?",["10 V","14,1 V","20 V","7 V"],"URMS = Uspiss / √2 = 0,707 × 14,1 ≈ 10 V.",1);
Q("el","Hva er den andre harmoniske av 7,1 MHz?",["14,2 MHz","21,3 MHz","3,55 MHz","7,1 MHz"],"Andre harmoniske = 2 × grunnfrekvensen.",1);
Q("el","Hva er faseforholdet mellom strøm og spenning i en kondensator?",["Spenningen ligger 90° etter strømmen","Spenningen ligger 90° foran strømmen","De er i fase","De er 180° ute av fase"],"I en kondensator ligger strømmen foran. I en spole er det motsatt: spenningen ligger foran.");
Q("el","Hva er faseforholdet mellom strøm og spenning i en ideell spole?",["Spenningen ligger 90° foran strømmen","Spenningen ligger 90° etter strømmen","De er i fase","De er 45° forskjøvet"],"I en spole ligger spenningen 90° foran strømmen.");
Q("el","Hva skjer med reaktansen til en kondensator når frekvensen øker?",["Den minker","Den øker","Den er uendret","Den blir null ved 50 Hz"],"XC = 1/(2πfC). Høyere frekvens gir lavere reaktans.");

Q("el","Hva er reaktansen til en spole på 10 µH ved 7 MHz?",["Ca. 440 Ω","Ca. 70 Ω","Ca. 2,3 Ω","Ca. 4,4 kΩ"],"XL = 2π × 7·10⁶ × 10·10⁻⁶ = 2π × 70 ≈ 440 Ω.",1);

const WEIGHT = [10, 6, 3, 1.2, 0.5];  // hvor ofte et spørsmål trekkes, etter nivå 0–4
const MASTER = 3;                    // tre riktige på rad = mestret
const STORE = "lisensquiz-v1";

const store = { tab:"quiz", set:"all", chosen: CHAPTERS.map((c) => c.k), boxes:{}, seen:{}, answered:0, correct:0, streak:0, best:0, examLen:30 };
let recent = [], soon = [], Q1 = null, EX = null, armed = false, armTimer = 0;

function load(){
  try{
    const s = JSON.parse(localStorage.getItem(STORE) || "null");
    if(!s || typeof s !== "object") return;
    if(["quiz","exam","chapters"].includes(s.tab)) store.tab = s.tab;
    if(["all","chosen","weak"].includes(s.set)) store.set = s.set;
    if(Array.isArray(s.chosen)) store.chosen = s.chosen.filter((k) => CH[k]);
    if([20,30,50].includes(s.examLen)) store.examLen = s.examLen;
    for(const key of ["boxes","seen"]){
      if(s[key] && typeof s[key] === "object"){
        for(const id of Object.keys(s[key])){
          const v = Number(s[key][id]);
          if(Number.isInteger(v) && v >= 0 && v <= 99999) store[key][id] = key === "boxes" ? Math.min(4, v) : v;
        }
      }
    }
    for(const k of ["answered","correct","streak","best"]){
      const v = Number(s[k]);
      if(Number.isFinite(v) && v >= 0) store[k] = Math.floor(v);
    }
  }catch(e){}
}
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(store)); }catch(e){} }

const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));
const esc = (s) => String(s).replace(/[&<>"']/g, (ch) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
function shuffle(a){ for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
const boxOf = (id) => store.boxes[id] || 0;
const reduceMotion = () => !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
function toTop(){ try{ window.scrollTo({top:0, behavior: reduceMotion() ? "auto" : "smooth"}); }catch(e){} }
const chapLabel = (k) => `Kap. ${CH[k].n} ${CH[k].t}`;

function pool(){
  if(store.set === "chosen"){
    const set = new Set(store.chosen);
    return QS.filter((x) => set.has(x.k));
  }
  if(store.set === "weak") return QS.filter((x) => store.seen[x.id] && boxOf(x.id) < MASTER);
  return QS;
}

function grade(id, ok){
  store.seen[id] = (store.seen[id] || 0) + 1;
  store.boxes[id] = ok ? Math.min(4, boxOf(id) + 1) : 0;
  if(!ok){ soon = soon.filter((s) => s.id !== id); soon.push({id, n:4}); }
}

function pick(P){
  const byId = new Map(P.map((p) => [p.id, p]));
  soon = soon.filter((s) => byId.has(s.id));
  soon.forEach((s) => { s.n--; });
  let item = null;
  const due = soon.findIndex((s) => s.n <= 0 && !recent.includes(s.id));
  if(due >= 0) item = byId.get(soon.splice(due, 1)[0].id) || null;
  if(!item){
    const fresh = P.filter((p) => !recent.includes(p.id));
    const list = fresh.length ? fresh : P;
    const ws = list.map((p) => WEIGHT[boxOf(p.id)]);
    let r = Math.random() * ws.reduce((a, b) => a + b, 0);
    item = list[list.length - 1];
    for(let i = 0; i < list.length; i++){ r -= ws[i]; if(r <= 0){ item = list[i]; break; } }
  }
  recent.push(item.id);
  while(recent.length > Math.min(8, Math.floor(P.length / 2))) recent.shift();
  return item;
}

const makeOpts = (item) => shuffle(item.o.map((t, i) => ({t, ok: i === 0})));

function newQuestion(){
  const P = pool();
  if(!P.length){ Q1 = null; return; }
  const item = pick(P);
  Q1 = { item, opts: makeOpts(item), done:false, picked:-1 };
}

/* ---------- Visning ---------- */

function optRows(opts, state){
  // state: {done, picked, examMode}
  return opts.map((o, i) => {
    let cls = "opt", mark = "";
    if(state.done){
      if(o.ok){ cls += " is-right"; mark = "✓"; }
      else if(i === state.picked){ cls += " is-wrong"; mark = "✗"; }
      else cls += " is-dim";
    } else if(state.examMode && i === state.picked){ cls += " is-picked"; }
    return `<button type="button" class="${cls}" data-opt="${i}"${state.done ? ' aria-disabled="true"' : ""}><span class="letter">${"ABCD"[i]}</span><span><span class="txt">${esc(o.t)}</span></span><span class="mark" aria-hidden="true">${mark}</span></button>`;
  }).join("");
}

function questionHead(item){
  return `<p class="ask">${esc(chapLabel(item.k))}${item.r ? '<span class="calc">Regning</span>' : ""}</p><p class="prompt">${esc(item.q)}</p>`;
}

function renderQuiz(){
  if(!Q1) newQuestion();
  if(!Q1){
    return `<p class="empty">${store.set === "weak"
      ? "Ingen spørsmål å øve på her ennå. «Øv på svake» viser spørsmål du har svart på, men ikke mestret. Øv litt på alle først."
      : "Ingen kapitler er valgt. Gå til «Kapitler» og velg hvilke du vil øve på."}</p>`;
  }
  const {item, opts, done, picked} = Q1;
  let reveal = "";
  if(done){
    const ok = picked >= 0 && opts[picked].ok;
    let verdict;
    if(ok) verdict = `<p class="verdict" role="status">✓ Riktig!${store.streak >= 3 ? ` ${store.streak} på rad.` : ""}</p>`;
    else if(picked >= 0) verdict = `<p class="verdict bad" role="status">✗ Ikke helt – det riktige svaret er markert.</p>`;
    else verdict = `<p class="verdict" role="status">Her er svaret:</p>`;
    reveal = `<div class="reveal">${verdict}<p class="explain"><b>Forklaring:</b>${esc(item.f)}</p></div>`;
  }
  return `<section class="quiz">${questionHead(item)}<div class="tbl"><div class="bar chap-bar"><span>Velg ett svar</span><span class="k">1–4 / A–D</span></div><div class="rows">${optRows(opts, {done, picked})}</div></div>${reveal}</section>`;
}

function examStart(){
  const n = store.examLen;
  // Trekk jevnt fra alle kapitler, i forhold til hvor mange spørsmål kapitlet har
  const byCh = {};
  for(const q of QS) (byCh[q.k] = byCh[q.k] || []).push(q);
  let picks = [];
  const quotas = CHAPTERS.map((c) => ({k:c.k, exact: n * (byCh[c.k] || []).length / QS.length}));
  quotas.forEach((x) => { x.n = Math.floor(x.exact); x.rest = x.exact - x.n; });
  let left = n - quotas.reduce((a, x) => a + x.n, 0);
  quotas.slice().sort((a, b) => b.rest - a.rest).forEach((x) => { if(left > 0){ x.n++; left--; } });
  for(const x of quotas) picks = picks.concat(shuffle((byCh[x.k] || []).slice()).slice(0, x.n));
  picks = shuffle(picks);
  EX = { items: picks.map((item) => ({item, opts: makeOpts(item), picked:-1})), i:0, finished:false };
}

function renderExam(){
  if(!EX){
    return `<div class="exam-intro">
        <p><b>Prøvetest:</b> Spørsmål fra alle kapitlene, trukket i forhold til hvor mye hvert kapittel fyller. Du får ikke vite svaret underveis – fasit og forklaringer kommer til slutt.</p>
        <p>Velg antall spørsmål over, og trykk «Start prøvetest».</p>
      </div>`;
  }
  if(EX.finished) return renderResult();
  const cur = EX.items[EX.i];
  return `<section class="quiz">
    <p class="count">Spørsmål ${EX.i + 1} av ${EX.items.length}</p>
    ${questionHead(cur.item)}
    <div class="tbl"><div class="bar chap-bar"><span>Velg ett svar</span><span class="k">${EX.items.filter((x) => x.picked >= 0).length} besvart</span></div><div class="rows">${optRows(cur.opts, {done:false, picked:cur.picked, examMode:true})}</div></div>
  </section>`;
}

function renderResult(){
  const total = EX.items.length;
  const right = EX.items.filter((x) => x.picked >= 0 && x.opts[x.picked].ok).length;
  const pct = Math.round(100 * right / total);
  const per = {};
  for(const x of EX.items){
    const p = per[x.item.k] = per[x.item.k] || {n:0, r:0};
    p.n++; if(x.picked >= 0 && x.opts[x.picked].ok) p.r++;
  }
  const rows = CHAPTERS.filter((c) => per[c.k]).map((c) => `<div class="bd-row"><span>${esc(chapLabel(c.k))}</span><span><b>${per[c.k].r}</b> av ${per[c.k].n}</span></div>`).join("");
  const misses = EX.items.filter((x) => !(x.picked >= 0 && x.opts[x.picked].ok));
  const missHtml = misses.map((x) => {
    const correct = x.opts.find((o) => o.ok).t;
    const yours = x.picked >= 0 ? x.opts[x.picked].t : null;
    return `<div class="miss">
      <p class="ask">${esc(chapLabel(x.item.k))}</p>
      <p class="miss-q">${esc(x.item.q)}</p>
      ${yours ? `<p class="miss-a bad">${esc(yours)}</p>` : `<p class="miss-a" style="color:var(--ink-3)">Ikke besvart</p>`}
      <p class="miss-a">✓ <span class="txt" style="background-image:linear-gradient(102deg,transparent .18em,var(--hl) .3em,var(--hl) calc(100% - .3em),transparent calc(100% - .18em));background-repeat:no-repeat;background-size:100% 78%;background-position:0 60%;color:var(--hl-ink);padding:0 .3em">${esc(correct)}</span></p>
      <p class="explain"><b>Forklaring:</b>${esc(x.item.f)}</p>
    </div>`;
  }).join("");
  return `<section>
    <p class="ask">Resultat</p>
    <div class="score"><span class="big">${pct} %</span><span class="of">${right} av ${total} riktige</span></div>
    <p class="verdict${pct < 60 ? " bad" : ""}">${pct >= 90 ? "Glimrende! Du er godt forberedt." : pct >= 75 ? "Bra! Se gjennom det du bommet på." : pct >= 60 ? "På god vei – øv mer på kapitlene under." : "Fortsett å øve – bruk «Øv» på kapitlene der du bommet mest."}</p>
    <div class="breakdown">${rows}</div>
    ${misses.length ? `<h2 class="sec">Det du bommet på (${misses.length})</h2><div>${missHtml}</div>` : `<h2 class="sec">Alt riktig!</h2>`}
  </section>`;
}

function chapStats(k){
  const items = QS.filter((x) => x.k === k);
  const lv = [0, 0, 0, 0];
  for(const x of items) lv[Math.min(3, boxOf(x.id))]++;
  return {n: items.length, lv, mastered: items.filter((x) => boxOf(x.id) >= MASTER).length};
}

function progHtml(lv, n, cls){
  const seg = (c, v) => v ? `<i class="${c}" style="width:${(100 * v / n).toFixed(2)}%"></i>` : "";
  return `<div class="prog${cls ? " " + cls : ""}" aria-hidden="true">${seg("l3", lv[3])}${seg("l2", lv[2])}${seg("l1", lv[1])}</div>`;
}

function renderChapters(){
  const chosen = new Set(store.chosen);
  const rows = CHAPTERS.map((c) => {
    const s = chapStats(c.k);
    const on = chosen.has(c.k);
    return `<li class="chap${on ? " on" : ""}" data-chap="${c.k}" role="checkbox" aria-checked="${on}" tabindex="0">
      <span><span class="box" aria-hidden="true">${on ? "✓" : ""}</span></span>
      <div>
        <div class="chap-h"><span class="chap-n">Kap. ${esc(c.n)} ${esc(c.t)}</span><span class="chap-c">${s.mastered}/${s.n}</span></div>
        ${progHtml(s.lv, s.n, "sm")}
      </div>
    </li>`;
  }).join("");
  return `<div class="intro">
      <p>Huk av kapitlene du vil øve på, og velg «Valgte kapitler» under «Øv». Tallet til høyre viser hvor mange spørsmål du har mestret (tre riktige på rad).</p>
    </div>
    <div class="chap-tools">
      <button type="button" class="ghost" id="selAll">Velg alle</button>
      <button type="button" class="ghost" id="selNone">Fjern alle</button>
      <button type="button" class="ghost" id="goPractice">Øv på valgte</button>
    </div>
    <div class="book"><div class="bar"><span>Kapittel i læreboka</span></div><ul class="rowlist">${rows}</ul></div>
    <div class="foot">
      <button type="button" class="ghost" id="reset">Nullstill fremgang</button>
      <p class="src">Spørsmålene er laget fra læringsmålene og læreboka «Veien til internasjonal radioamatørlisens» (NRRL), med regler fra forskrift om radioamatørvirksomhet (Nkom, 23.03.2026). Dette er ikke de offisielle eksamensspørsmålene. Kapittel 1, 14 og 15 har ikke eget pensum her.</p>
    </div>`;
}

function renderControls(){
  const c = $("#controls");
  if(store.tab === "quiz"){
    const nAll = QS.length;
    const nCh = QS.filter((x) => store.chosen.includes(x.k)).length;
    const nWeak = QS.filter((x) => store.seen[x.id] && boxOf(x.id) < MASTER).length;
    c.innerHTML = `<div class="toggle" role="group" aria-label="Hvilke spørsmål">
      <button type="button" data-set="all"><span class="lbl">Alle <span class="n">${nAll}</span></span></button>
      <button type="button" data-set="chosen"><span class="lbl">Valgte kapitler <span class="n">${nCh}</span></span></button>
      <button type="button" data-set="weak"><span class="lbl"><span class="dot sm" aria-hidden="true"></span>Øv på svake <span class="n">${nWeak}</span></span></button>
    </div>`;
  } else if(store.tab === "exam"){
    c.innerHTML = (EX && !EX.finished) ? "" : `<div class="toggle" role="group" aria-label="Antall spørsmål">
      ${[20,30,50].map((n) => `<button type="button" data-len="${n}"><span class="lbl">${n} spørsmål</span></button>`).join("")}
    </div>`;
  } else c.innerHTML = "";
  c.hidden = !c.innerHTML;
  $$("[data-set]").forEach((b) => { const on = b.dataset.set === store.set; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on ? "true" : "false"); });
  $$("[data-len]").forEach((b) => { const on = Number(b.dataset.len) === store.examLen; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on ? "true" : "false"); });
}

function renderMeter(){
  const wrap = $("#meterWrap");
  if(store.tab === "exam" && EX && !EX.finished){
    const n = EX.items.length;
    const done = EX.i;
    $("#prog").innerHTML = `<i class="l3" style="width:${(100 * done / n).toFixed(2)}%"></i>`;
    $("#stats").innerHTML = `<span><b>${done}</b> av ${n}</span>`;
    wrap.hidden = false;
    return;
  }
  if(store.tab === "exam"){ wrap.hidden = true; return; }
  wrap.hidden = false;
  const P = store.tab === "quiz" ? pool() : QS;
  const lv = [0, 0, 0, 0];
  for(const x of P) lv[Math.min(3, boxOf(x.id))]++;
  $("#prog").innerHTML = P.length ? progHtml(lv, P.length).replace(/^<div[^>]*>|<\/div>$/g, "") : "";
  const mastered = lv[3];
  const bits = [P.length && mastered === P.length ? `<span><b>Alle ${P.length} mestret!</b></span>` : `<span><b>${mastered}</b> av ${P.length} mestret</span>`];
  if(store.streak > 0) bits.push(`<span><b>${store.streak}</b> ${store.streak === 1 ? "riktig" : "riktige"} på rad</span>`);
  if(store.answered > 0) bits.push(`<span><b>${Math.round(100 * store.correct / store.answered)} %</b> riktig totalt</span>`);
  $("#stats").innerHTML = bits.join("");
}

function dockHtml(){
  if(store.tab === "quiz"){
    if(!Q1) return "";
    return Q1.done
      ? `<button type="button" class="btn primary" id="next">Neste spørsmål</button>`
      : `<button type="button" class="btn" id="skip">Vet ikke – vis svaret</button>`;
  }
  if(store.tab === "exam"){
    if(!EX) return `<button type="button" class="btn primary" id="examGo">Start prøvetest</button>`;
    if(EX.finished) return `<button type="button" class="btn" id="examNew">Ny prøvetest</button>`;
    const last = EX.i === EX.items.length - 1;
    return `${EX.i > 0 ? `<button type="button" class="btn" id="examBack">Forrige</button>` : ""}<button type="button" class="btn primary" id="examNext">${last ? "Lever prøven" : "Neste"}</button>`;
  }
  return "";
}

function render(){
  $$("[data-tab]").forEach((b) => { const on = b.dataset.tab === store.tab; b.classList.toggle("on", on); b.setAttribute("aria-selected", on ? "true" : "false"); });
  renderControls();
  const v = $("#view");
  if(store.tab === "quiz") v.innerHTML = renderQuiz();
  else if(store.tab === "exam") v.innerHTML = renderExam();
  else v.innerHTML = renderChapters();
  renderMeter();
  const d = dockHtml();
  $("#dockIn").innerHTML = d;
  $("#dock").hidden = !d;
  document.body.classList.toggle("has-dock", !!d);
}

/* ---------- Handlinger ---------- */

function answer(i){
  if(!Q1 || Q1.done) return;
  const ok = i >= 0 && Q1.opts[i].ok;
  Q1.done = true; Q1.picked = i;
  store.answered++;
  if(ok){ store.correct++; store.streak++; store.best = Math.max(store.best, store.streak); }
  else store.streak = 0;
  grade(Q1.item.id, ok);
  save(); render();
  const r = $(".reveal");
  if(r && r.scrollIntoView) r.scrollIntoView({block:"nearest", behavior: reduceMotion() ? "auto" : "smooth"});
}

function examPick(i){
  if(!EX || EX.finished) return;
  EX.items[EX.i].picked = i;
  render();
}
function examNext(){
  if(!EX || EX.finished) return;
  if(EX.i < EX.items.length - 1){ EX.i++; render(); toTop(); return; }
  const unanswered = EX.items.filter((x) => x.picked < 0).length;
  if(unanswered && !confirm(`Du har ${unanswered} ubesvarte spørsmål. Vil du levere likevel?`)) return;
  EX.finished = true;
  for(const x of EX.items){
    const ok = x.picked >= 0 && x.opts[x.picked].ok;
    store.answered++; if(ok) store.correct++;
    grade(x.item.id, ok);
  }
  soon = [];
  save(); render(); toTop();
}

function toggleChap(k){
  const s = new Set(store.chosen);
  if(s.has(k)) s.delete(k); else s.add(k);
  store.chosen = CHAPTERS.map((c) => c.k).filter((x) => s.has(x));
  if(store.set === "chosen") Q1 = null;
  save(); render();
}

function handleReset(btn){
  if(!armed){
    armed = true;
    btn.textContent = "Trykk igjen for å nullstille";
    btn.classList.add("armed");
    clearTimeout(armTimer);
    armTimer = setTimeout(() => { armed = false; if(btn.isConnected){ btn.textContent = "Nullstill fremgang"; btn.classList.remove("armed"); } }, 4000);
    return;
  }
  armed = false; clearTimeout(armTimer);
  store.boxes = {}; store.seen = {}; store.answered = 0; store.correct = 0; store.streak = 0; store.best = 0;
  recent = []; soon = []; Q1 = null;
  save(); render();
}

document.addEventListener("click", (e) => {
  const chap = e.target.closest("[data-chap]");
  if(chap){ toggleChap(chap.dataset.chap); return; }
  const t = e.target.closest("button");
  if(!t) return;
  const ds = t.dataset;
  if(ds.tab){ if(store.tab !== ds.tab){ store.tab = ds.tab; save(); render(); toTop(); } return; }
  if(ds.set){ if(store.set !== ds.set){ store.set = ds.set; recent = []; soon = []; Q1 = null; save(); render(); } return; }
  if(ds.len){ store.examLen = Number(ds.len); save(); render(); return; }
  if(ds.opt !== undefined){
    if(store.tab === "quiz") answer(Number(ds.opt));
    else if(store.tab === "exam") examPick(Number(ds.opt));
    return;
  }
  switch(t.id){
    case "skip": answer(-1); break;
    case "next": Q1 = null; render(); toTop(); break;
    case "examGo": case "examNew": examStart(); render(); toTop(); break;
    case "examNext": examNext(); break;
    case "examBack": if(EX && EX.i > 0){ EX.i--; render(); toTop(); } break;
    case "selAll": store.chosen = CHAPTERS.map((c) => c.k); Q1 = null; save(); render(); break;
    case "selNone": store.chosen = []; Q1 = null; save(); render(); break;
    case "goPractice": store.tab = "quiz"; store.set = "chosen"; recent = []; soon = []; Q1 = null; save(); render(); toTop(); break;
    case "reset": handleReset(t); break;
  }
});

document.addEventListener("keydown", (e) => {
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  const k = String(e.key).toLowerCase();
  const onButton = !!(e.target && e.target.closest && e.target.closest("button,[data-chap]"));
  const idx = {"1":0,"2":1,"3":2,"4":3,"a":0,"b":1,"c":2,"d":3}[k];
  if(store.tab === "chapters" && (k === "enter" || k === " ") && e.target.closest && e.target.closest("[data-chap]")){
    e.preventDefault(); toggleChap(e.target.closest("[data-chap]").dataset.chap); return;
  }
  if(store.tab === "quiz" && Q1){
    if(!Q1.done && idx !== undefined && idx < Q1.opts.length){ e.preventDefault(); answer(idx); return; }
    if(Q1.done && (k === "enter" || k === " ") && !onButton){ e.preventDefault(); Q1 = null; render(); toTop(); }
    return;
  }
  if(store.tab === "exam" && EX && !EX.finished){
    if(idx !== undefined){ e.preventDefault(); examPick(idx); return; }
    if((k === "enter" || k === "arrowright") && !onButton){ e.preventDefault(); examNext(); return; }
    if(k === "arrowleft" && EX.i > 0){ e.preventDefault(); EX.i--; render(); }
  }
});

load();
render();
})();
</script>

}
